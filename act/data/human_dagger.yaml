schema_version: 2
recorder_queue_size: 32

ros:
  node_name: human_dagger
  state_topic: /human_dagger/state
  hold_service: /human_dagger/request_hold
  body_feedback_topic: /body_information
  left:
    vr_topic: /human_dagger/vr/left_raw
    status_topic: /human_dagger/arm/left/status
    command_topic: /human_dagger/arm/left/command
  right:
    vr_topic: /human_dagger/vr/right_raw
    status_topic: /human_dagger/arm/right/status
    command_topic: /human_dagger/arm/right/command

cameras:
  names: [camera_h, camera_l, camera_r]
  topics:
    camera_h: /camera/camera_h/color/image_rect_raw/compressed
    camera_l: /camera/camera_l/color/image_rect_raw/compressed
    camera_r: /camera/camera_r/color/image_rect_raw/compressed

control:
  rate_hz: 60
  joint_mode: 5
  eef_mode: 4
  feedback_timeout_ms: 100
  vr_timeout_ms: 100
  camera_timeout_ms: 250
  policy_timeout_ms: 250
  handoff_timeout_s: 2.0
  policy_slew_duration_s: 2.0
  # Maximum joint/gripper change emitted per 60 Hz tick while resuming policy.
  policy_slew_step_per_arm: [0.05, 0.05, 0.03, 0.05, 0.05, 0.05, 0.2]
  future_timestamp_tolerance_ms: 5
  # Hold-to-engage takeover from a VR button channel. Disabled until the
  # button-to-mode mapping has been measured on this headset: mode1/mode2
  # are parsed inside a closed-source library, and mode1 is also consumed
  # by the body controller as a chassis command. Only TAKEOVER is
  # automated; returning to the policy stays on the P key.
  vr_engage_enabled: false
  vr_engage_field: mode1
  vr_engage_side: left
  vr_engage_active_value: 1
  # HUMAN drives the gripper as an absolute binary target: release the
  # trigger to open, squeeze it to close, regardless of where the policy
  # left the jaw before the takeover.  The band between the two trigger
  # thresholds is hysteretic and holds the current endpoint.
  # Raw VR trigger travel is 0 (released) to 5 (fully squeezed).
  gripper_trigger_open_below: 2.0
  gripper_trigger_close_above: 3.0
  gripper_open_value: 0.0
  gripper_closed_value: -3.384
  # One Euro smoothing of the HUMAN-mode target (teleop feel). Strong smoothing
  # at rest kills tracker noise and the 60Hz-sampling stutter; smoothing fades
  # automatically as hand speed rises. Set human_filter_min_cutoff_hz: 0 to
  # disable and compare raw behavior.
  human_filter_min_cutoff_hz: 1.0
  human_filter_beta: 0.15
  human_filter_d_cutoff_hz: 1.0

# Where both arms park before every recorded episode. Pressing the record key
# walks them here first, and the episode only starts once the arms are measured
# to have arrived, so every dataset begins from the same pose.
#
# The joint angles were measured on this robot; tools/08_collect_ready_pose.sh
# carries the same numbers for the ACT collection path. They are deliberately
# NOT passed to X5Controller as go_home_position: act/shutdown_arm_home.py
# reads that parameter to decide where the arms park before the lift comes
# down, and that pose should stay the compact all-zeros one.
#
# The gripper values come from READY_GRIPPER in act/ready_pose.py.
#
# step_per_arm is the per-60Hz-tick joint/gripper limit. It is half the policy
# handoff slew because this move can cross a much larger distance: 0.025 rad
# per tick is 1.5 rad/s.
#
# Set enabled: false (or run with READY_POSE_MOVE=0) to switch the move off
# without editing anything else; the record key then hands straight over to
# the policy, exactly as it did before.
ready_pose:
  enabled: true
  left:  [-0.0002, 0.9447, 0.8597, -0.5755,  0.0006, -0.0013]
  right: [-0.0002, 0.9466, 0.8604, -0.5724, -0.0002, -0.0006]
  gripper: [-2.9717, -2.9675]
  step_per_arm: [0.025, 0.025, 0.015, 0.025, 0.025, 0.025, 0.1]
  timeout_s: 15.0
  arrival_tolerance: 0.05

episode:
  max_timesteps: 800
  auto_save_without_intervention: true
  dataset_dir: dagger_datasets
  quarantine_dir: dagger_datasets/quarantine
  writer_flush_frames: 60

keys:
  start: r
  takeover: space
  resume_policy: p
  end: e
  save: s
  discard: d
  quit: q

precheck:
  # Effectively disable the feedback-vs-command height assertion: this lift
  # reports ~0.58 lower than commanded (calibration offset), so the default
  # 0.1 tolerance can never pass on this machine.
  height_tolerance: 100.0
